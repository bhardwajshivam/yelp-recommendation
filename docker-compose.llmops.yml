services:
  rag-api:
    build:
      context: .
    environment:
      YCA_CONFIG_PATH: /app/configs/base.yaml
      YCA_DATA_DIR: /app/data
      YCA_DUCKDB_PATH: /app/data/yelp.duckdb
      YCA_VLLM_BASE_URL: http://vllm:8000/v1
      YCA_ENABLE_PROMETHEUS_METRICS: "true"
      YCA_ENABLE_MLFLOW: "true"
      YCA_MLFLOW_TRACKING_URI: http://mlflow:5000
      YCA_MLFLOW_EXPERIMENT_NAME: yelp-cost-aware-agent
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs:ro
    depends_on:
      - mlflow
      - qdrant

  vllm:
    image: vllm/vllm-openai:latest
    command:
      - --model
      - TinyLlama/TinyLlama-1.1B-Chat-v1.0
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8001:8000"
    volumes:
      - vllm-cache:/root/.cache/huggingface
    profiles:
      - gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow

  prometheus:
    image: prom/prometheus:v2.55.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - rag-api

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  grafana-data:
  mlflow-data:
  prometheus-data:
  qdrant-data:
  vllm-cache:
